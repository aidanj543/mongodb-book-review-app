
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MongoDB Assignment | Book Review Application</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script defer
            src="{{ url_for('static', filename='script.js') }}">
    </script>
</head>
<body>


    <header class="navbar">
        <div class="container nav-content">
            <h1>📚 MongoDB Book Database</h1>
            <span>Discover • Read • Review</span>
        </div>
    </header>

    <main class="container">


        <section class="hero">
            <h2>Discover your next great read.</h2>
            <p>
                Explore books, share your thoughts,
                and discover what others are reading.
            </p>
        </section>


        <section class="panel">
            <h2>Add a New Book</h2>

            <form id="book-form">

                <div class="form-row">
                    <div class="form-group">
                        <label for="book-title">Title</label>
                        <input
                            type="text"
                            id="book-title"
                            maxlength="200"
                            placeholder="Enter book title"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="book-author">Author</label>
                        <input
                            type="text"
                            id="book-author"
                            maxlength="200"
                            placeholder="Enter author's name"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="book-genre">Genre</label>
                    <input
                        type="text"
                        id="book-genre"
                        maxlength="200"
                        placeholder="Fantasy, Fiction, etc."
                        required>
                </div>

                <button type="submit" class="primary-btn">
                    Add Book
                </button>

            </form>

            <p id="book-message"
               class="message"
               role="status"
               aria-live="polite"></p>
        </section>


        <section class="books-section">

            <div class="section-heading">
                <h2>Explore Books</h2>

                <button id="refresh-btn"
                        class="secondary-btn"
                        type="button">
                    Refresh
                </button>
            </div>

            <p id="books-status"
               class="message"
               role="status"
               aria-live="polite"></p>

            <div id="books-container"
                 class="books-grid">
            </div>

        </section>

    </main>

    <footer>
        <p>MongoDB Book Database • Online Book Review Application</p>
    </footer>

</body>
</html>
